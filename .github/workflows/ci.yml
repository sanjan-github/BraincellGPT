name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Application checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Verify web UI exists
        run: python -c "from pathlib import Path; assert Path('web/index.html').is_file(), 'web/index.html is missing'"
      - name: Scan tracked files for common leaked secrets
        shell: bash
        run: |
          if git grep -n -I -E 'gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|nvapi-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!*.lock'; then
            echo "Potential secret detected in tracked files. Remove it and rotate the credential."
            exit 1
          fi
      - name: Start server and run smoke tests
        run: |
          python app.py &
          SERVER_PID=$!
          sleep 2

          # GET / must return HTTP 200
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/)
          [ "$STATUS" = "200" ] || { echo "GET / returned $STATUS, expected 200"; kill $SERVER_PID; exit 1; }

          # GET /health must return valid JSON with status=ok
          HEALTH=$(curl -s http://127.0.0.1:8000/health)
          echo "$HEALTH" | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok', f'Unexpected health: {d}'"

          # POST /api/chat with empty body must return 400
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/api/chat \
            -H "Content-Type: application/json" -d '{}')
          [ "$STATUS" = "400" ] || { echo "Empty-body POST returned $STATUS, expected 400"; kill $SERVER_PID; exit 1; }

          # POST /api/chat with missing key must return 502 with safe error
          RESP=$(curl -s -w "\n%{http_code}" -X POST http://127.0.0.1:8000/api/chat \
            -H "Content-Type: application/json" -d '{"message":"hello"}')
          STATUS=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -1)
          [ "$STATUS" = "502" ] || { echo "Missing-key POST returned $STATUS, expected 502"; kill $SERVER_PID; exit 1; }
          # Confirm the API key itself is NOT in the error response
          echo "$BODY" | python -c "import sys; body=sys.stdin.read(); assert 'GROQ_API_KEY' not in body or 'missing' in body, 'Key leaked in error'"

          kill $SERVER_PID
          echo "All smoke tests passed."

name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Application checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional native keyring adapter
        run: python -m pip install keyring
      - name: Check Python syntax
        run: python -m compileall -q app.py backend tests scripts
      - name: Verify web UI exists
        run: python -c "from pathlib import Path; assert Path('web/index.html').is_file(), 'web/index.html is missing'"
      - name: Run provider, security, and native credential-store tests
        run: python -m unittest discover -s tests -v
      - name: Scan tracked files for common leaked secrets
        shell: bash
        run: |
          if git grep -n -I -E 'gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|nvapi-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!*.lock'; then
            echo "Potential secret detected in tracked files. Remove it and rotate the credential."
            exit 1
          fi
      - name: Start from a clean virtual environment and smoke test HTTP
        run: python scripts/smoke_clean_install.py

  live-integrations:
    name: Opt-in live provider, MCP, and OAuth checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional keyring adapter
        run: python -m pip install keyring
      - name: Run configured live integration checks
        env:
          BRAINCELLGPT_LIVE_PROVIDER: ${{ vars.BRAINCELLGPT_LIVE_PROVIDER }}
          BRAINCELLGPT_LIVE_API_KEY: ${{ secrets.BRAINCELLGPT_LIVE_API_KEY }}
          BRAINCELLGPT_LIVE_BASE_URL: ${{ vars.BRAINCELLGPT_LIVE_BASE_URL }}
          BRAINCELLGPT_LIVE_MODEL: ${{ vars.BRAINCELLGPT_LIVE_MODEL }}
          BRAINCELLGPT_LIVE_MCP_URL: ${{ vars.BRAINCELLGPT_LIVE_MCP_URL }}
          BRAINCELLGPT_LIVE_MCP_TOKEN: ${{ secrets.BRAINCELLGPT_LIVE_MCP_TOKEN }}
          BRAINCELLGPT_LIVE_OAUTH_MCP_URL: ${{ vars.BRAINCELLGPT_LIVE_OAUTH_MCP_URL }}
          BRAINCELLGPT_LIVE_OAUTH_CHALLENGE: ${{ secrets.BRAINCELLGPT_LIVE_OAUTH_CHALLENGE }}
        run: python -m unittest discover -s tests -p test_live_integrations.py -v

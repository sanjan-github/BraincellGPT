<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030407">
<title>BraincellGPT — One Cell, Infinite Confusion</title>
<!-- Three.js for Photorealistic 3D Earth & Cosmic Space -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ==========================================================================
   Design Tokens — Apple SF Pro, Space Architecture, Fibonacci Scale
   ========================================================================== */
:root {
  --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", -system-ui, sans-serif;

  /* Fibonacci Spacing */
  --space-1: 5px;
  --space-2: 8px;
  --space-3: 13px;
  --space-4: 21px;
  --space-5: 34px;
  --space-6: 55px;
  --space-7: 89px;

  /* Fibonacci Type Scale */
  --text-micro: 11px;
  --text-caption: 13px;
  --text-body: 16px;
  --text-subhead: 21px;
  --text-headline: 34px;
  --text-display: 55px;

  /* Apple Squircle Radii (r = s * 0.2237) */
  --radius-xs: 6px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 22px;
  --radius-pill: 9999px;

  /* Cosmic Space Palette */
  --color-base: #030407;
  --color-sidebar: rgba(10, 12, 18, 0.82);
  --color-surface: rgba(16, 20, 28, 0.74);
  --color-surface-hover: rgba(26, 32, 44, 0.88);
  --color-border: rgba(255, 255, 255, 0.09);
  --color-border-hover: rgba(255, 255, 255, 0.18);
  
  --text-primary: #FFFFFF;
  --text-secondary: #9DA3B4;
  --text-tertiary: #5E6375;
  --composer-bg: rgba(13, 16, 24, 0.85);

  --color-accent: #0084FF;
  --color-accent-hover: #1A90FF;
  --color-accent-text: #FFFFFF;

  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html, body {
  height: 100%;
  width: 100%;
  background: var(--color-base);
  color: var(--text-primary);
  font-family: var(--font-family);
  font-size: var(--text-body);
  line-height: 1.5;
  overflow: hidden;
}

/* Fullscreen Space Canvas */
#spaceCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
  pointer-events: none;
}

button, input, select, textarea {
  font-family: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: transparent;
  outline: none;
  touch-action: manipulation;
  transition: transform 120ms ease, background-color 140ms ease, border-color 140ms ease, color 140ms ease, opacity 140ms ease;
}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}

button:active {
  transform: scale(0.97);
}

/* ==========================================================================
   Shell Layout — Desktop & Mobile Cohesive
   ========================================================================== */
.app-shell {
  display: flex;
  height: 100vh;
  width: 100vw;
  padding: var(--space-3);
  gap: var(--space-3);
  position: relative;
  z-index: 1;
  overflow: hidden;
}

/* ==========================================================================
   Sidebar Navigation (With Smooth Collapse & Restore)
   ========================================================================== */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--color-sidebar);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  padding: var(--space-4) var(--space-3);
  user-select: none;
  z-index: 40;
  transition: transform 260ms var(--ease-drawer), width 240ms ease, padding 240ms ease, opacity 200ms ease;
}

.sidebar.collapsed {
  width: 0;
  padding: 0;
  border: none;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}

.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--color-border);
}

.brand-badge {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  text-decoration: none;
  color: var(--text-primary);
}

.brand-icon {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  color: var(--color-accent);
}

.brand-title {
  font-size: var(--text-body);
  font-weight: 700;
  letter-spacing: -0.02em;
}

.btn-sidebar-collapse {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: grid;
  place-items: center;
  color: var(--text-secondary);
}

.btn-sidebar-collapse:hover {
  background: var(--color-surface-hover);
  color: var(--text-primary);
}

/* "+ New Chat" Button */
.btn-new-chat {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  width: 100%;
  padding: 10px var(--space-3);
  margin-top: var(--space-3);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  color: var(--text-primary);
  font-size: var(--text-caption);
  font-weight: 600;
  transition: all 140ms ease;
}

.btn-new-chat:hover {
  background: var(--color-surface-hover);
  border-color: var(--color-border-hover);
}

/* Search Bar */
.search-chats-bar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  margin-top: var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  color: var(--text-tertiary);
  font-size: var(--text-caption);
}

.search-chats-bar input {
  border: none;
  outline: none;
  background: transparent;
  width: 100%;
  font-size: var(--text-caption);
  color: var(--text-primary);
}

.search-chats-bar input::placeholder {
  color: var(--text-tertiary);
}

/* Nav Session History */
.nav-history-wrapper {
  flex: 1;
  overflow-y: auto;
  margin: var(--space-3) 0;
  scrollbar-width: thin;
}

.nav-section-title {
  font-size: var(--text-micro);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-tertiary);
  padding: var(--space-1) var(--space-2) var(--space-2) var(--space-2);
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.history-item {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: var(--text-caption);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border: 1px solid transparent;
  transition: all 140ms ease;
}

.history-item:hover {
  background: var(--color-surface-hover);
  color: var(--text-primary);
}

.history-item.active {
  background: var(--color-surface);
  border-color: var(--color-border);
  color: var(--text-primary);
  font-weight: 600;
}

.history-item svg {
  flex-shrink: 0;
  color: var(--text-tertiary);
}

/* Sidebar Footer User Pill */
.sidebar-user-pill {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  margin-top: auto;
}

.user-profile-info {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-pill);
  background: var(--color-accent);
  display: grid;
  place-items: center;
  color: #FFFFFF;
  font-weight: 700;
  font-size: var(--text-caption);
}

.user-names {
  display: flex;
  flex-direction: column;
}

.user-name-primary {
  font-size: var(--text-caption);
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.2;
}

.user-name-secondary {
  font-size: var(--text-micro);
  color: var(--text-tertiary);
}

.btn-sidebar-settings {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-xs);
  display: grid;
  place-items: center;
  color: var(--text-secondary);
}

.btn-sidebar-settings:hover {
  color: var(--text-primary);
  background: var(--color-surface-hover);
}

/* ==========================================================================
   Main Canvas Workspace
   ========================================================================== */
.main-canvas {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* Top Navigation Bar */
.top-nav {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-2);
  z-index: 20;
  flex-shrink: 0;
}

.top-left-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

/* Persistent Sidebar Restore/Toggle Button (Always visible on desktop and mobile) */
.btn-sidebar-toggle {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--color-border);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 140ms ease;
}

.btn-sidebar-toggle:hover {
  background: var(--color-surface-hover);
  border-color: var(--color-border-hover);
}

.active-provider-pill {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 6px var(--space-3);
  border-radius: var(--radius-sm);
  background: transparent;
  border: 1px solid var(--color-border);
  font-size: var(--text-caption);
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 140ms ease;
}

.active-provider-pill:hover {
  border-color: var(--color-border-hover);
  color: var(--text-primary);
}

.status-beacon {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #10B981;
  box-shadow: 0 0 8px #10B981;
}

.top-right-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.icon-btn-pill {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-pill);
  background: var(--color-surface);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--color-border);
  display: grid;
  place-items: center;
  color: var(--text-secondary);
  transition: all 140ms ease;
}

.icon-btn-pill:hover {
  border-color: var(--color-border-hover);
  color: var(--text-primary);
}

/* ==========================================================================
   Chat Viewport Canvas
   ========================================================================== */
.chat-viewport {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  padding: 0 var(--space-4);
  scrollbar-width: thin;
}

.content-center {
  max-width: 740px;
  width: 100%;
  margin: auto auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: var(--space-4);
}

/* ==========================================================================
   Real Earth Globe & Hero Statement
   ========================================================================== */
.hero-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  width: 100%;
  margin-bottom: var(--space-4);
}

/* Interactive 3D Earth Globe Container */
.globe-wrapper {
  position: relative;
  width: 200px;
  height: 200px;
  margin-bottom: var(--space-3);
  display: grid;
  place-items: center;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

.globe-wrapper:active {
  cursor: grabbing;
}

#globeContainer {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  filter: drop-shadow(0 0 28px rgba(0, 132, 255, 0.45));
}

.hero-title-main {
  font-size: var(--text-headline);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  line-height: 1.15;
  margin-bottom: var(--space-1);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
}

.hero-caption {
  font-size: var(--text-body);
  font-weight: 400;
  color: var(--text-secondary);
  margin-bottom: var(--space-5);
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
}

/* ==========================================================================
   Composer Box — Translucent Space Obsidian
   ========================================================================== */
.composer-container {
  width: 100%;
  max-width: 720px;
  background: var(--composer-bg);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 14px var(--space-4) 10px var(--space-4);
  display: flex;
  flex-direction: column;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
  transition: border-color 160ms ease, box-shadow 160ms ease;
  margin-bottom: var(--space-3);
}

.composer-container:focus-within {
  border-color: var(--color-accent);
  box-shadow: 0 0 20px rgba(0, 132, 255, 0.28), 0 16px 48px rgba(0, 0, 0, 0.6);
}

.composer-textarea {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  resize: none;
  color: var(--text-primary);
  font-size: var(--text-body);
  font-weight: 400;
  line-height: 1.5;
  min-height: 52px;
  max-height: 200px;
  padding: 4px 0 8px 0;
}

.composer-textarea::placeholder {
  color: var(--text-tertiary);
}

.composer-bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: var(--space-2);
  border-top: 1px solid var(--color-border);
}

/* Model Badge: Natural Transparent */
.model-info-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: var(--text-caption);
  font-weight: 500;
  user-select: none;
}

.model-info-pill svg {
  color: var(--color-accent);
}

/* Centered Upward Send Arrow */
.btn-submit-pill {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background: var(--color-accent);
  color: var(--color-accent-text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 140ms ease;
  box-shadow: 0 2px 10px rgba(0, 132, 255, 0.3);
}

.btn-submit-pill:hover:not(:disabled) {
  background: var(--color-accent-hover);
  box-shadow: 0 4px 14px rgba(0, 132, 255, 0.5);
}

.btn-submit-pill:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.btn-submit-pill svg {
  width: 15px;
  height: 15px;
  display: block;
}

/* ==========================================================================
   Messages Flow Area
   ========================================================================== */
.messages-flow {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  padding: var(--space-3) 0;
}

.chat-turn {
  display: flex;
  gap: var(--space-3);
}

.chat-turn.user {
  justify-content: flex-end;
}

.chat-turn.assistant {
  justify-content: flex-start;
}

.user-message-panel {
  background: var(--color-surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-body);
  line-height: 1.6;
  color: var(--text-primary);
  max-width: min(84%, 600px);
  white-space: pre-wrap;
  word-break: break-word;
}

.assistant-message-panel {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  max-width: 90%;
  background: var(--color-surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
}

.assistant-body {
  color: var(--text-primary);
  font-size: var(--text-body);
  line-height: 1.65;
  word-break: break-word;
}

.assistant-body p {
  margin-bottom: var(--space-3);
  white-space: pre-wrap;
}

.assistant-body p:last-child {
  margin-bottom: 0;
}

.message-meta-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.btn-action-text {
  font-size: var(--text-micro);
  font-weight: 600;
  color: var(--text-secondary);
  background: transparent;
  padding: 4px 8px;
  border-radius: var(--radius-xs);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn-action-text:hover {
  color: var(--text-primary);
  background: var(--color-surface-hover);
}

.thinking-notice {
  font-size: var(--text-caption);
  color: var(--color-accent);
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 6px var(--space-3);
  border-radius: var(--radius-pill);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
}

.thinking-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--color-accent);
  animation: pulse 1.4s infinite ease-in-out;
}

@keyframes pulse {
  0%, 100% { opacity: 0.3; transform: scale(0.85); }
  50% { opacity: 1; transform: scale(1.15); }
}

/* Natural Error Banner */
.error-banner {
  margin: var(--space-3) auto;
  padding: var(--space-1) 0;
  background: transparent;
  border: none;
  color: #FF5A5F;
  font-size: var(--text-caption);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
}

.error-mark {
  font-weight: 700;
  font-size: var(--text-caption);
  line-height: 1;
  color: #FF5A5F;
}

/* ==========================================================================
   Settings Drawer Panel
   ========================================================================== */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms ease;
  z-index: 100;
}

.drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.drawer-panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  max-width: 420px;
  background: rgba(12, 14, 20, 0.94);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-left: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 260ms var(--ease-drawer);
  z-index: 101;
}

.drawer-panel.open {
  transform: translateX(0);
}

.drawer-head {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.drawer-title {
  font-size: var(--text-body);
  font-weight: 700;
  color: var(--text-primary);
}

.drawer-body {
  padding: var(--space-4);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.form-label {
  font-size: var(--text-caption);
  font-weight: 600;
  color: var(--text-secondary);
}

.form-field {
  width: 100%;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 10px var(--space-3);
  font-size: var(--text-caption);
  color: var(--text-primary);
  transition: all 140ms ease;
}

.form-field:focus {
  border-color: var(--color-accent);
  outline: none;
}

.form-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-2);
  margin-top: 4px;
}

.profile-actions {
  grid-template-columns: 1fr auto auto;
}

.profile-actions .form-field {
  min-width: 0;
}

.btn-secondary {
  padding: 8px var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-size: var(--text-caption);
  font-weight: 600;
  color: var(--text-primary);
  text-align: center;
  transition: all 140ms ease;
}

.btn-secondary:hover:not(:disabled) {
  background: var(--color-surface-hover);
  border-color: var(--color-border-hover);
}

.btn-secondary:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.form-status {
  font-size: var(--text-micro);
  color: var(--text-tertiary);
  line-height: 1.5;
  padding-top: 2px;
}

.form-status[data-state="checking"] { color: #F59E0B; }
.form-status[data-state="success"] { color: #10B981; }

<!-- ==========================================================================
     Real Earth 3D Engine (Three.js WebGL) & Parallax Space Simulation
     ========================================================================== -->
<script>
(() => {
  // ========================================================================
  // 1. Fullscreen Parallax Outer Space Starfield Canvas
  // ========================================================================
  const spaceCanvas = document.querySelector("#spaceCanvas");
  const sCtx = spaceCanvas.getContext("2d");

  let spaceW = (spaceCanvas.width = window.innerWidth);
  let spaceH = (spaceCanvas.height = window.innerHeight);

  window.addEventListener("resize", () => {
    spaceW = spaceCanvas.width = window.innerWidth;
    spaceH = spaceCanvas.height = window.innerHeight;
    initStars();
  });

  const STAR_COUNT = 1200;
  const stars = [];

  function initStars() {
    stars.length = 0;
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: (Math.random() - 0.5) * spaceW * 2.8,
        y: (Math.random() - 0.5) * spaceH * 2.8,
        z: Math.random() * 1000 + 100,
        size: Math.random() * 1.5 + 0.35,
        baseAlpha: Math.random() * 0.75 + 0.25,
        twinkleSpeed: Math.random() * 0.02 + 0.005,
        twinklePhase: Math.random() * Math.PI * 2,
        hue: Math.random() < 0.2 ? 210 : Math.random() < 0.1 ? 35 : 0
      });
    }
  }
  initStars();

  // Cosmic Nebula Cloud Formations
  const nebulae = [
    { x: -spaceW * 0.3, y: -spaceH * 0.25, r: 520, color: "rgba(40, 20, 65, 0.22)" },
    { x: spaceW * 0.35, y: spaceH * 0.3, r: 600, color: "rgba(18, 32, 65, 0.2)" },
    { x: 0, y: -spaceH * 0.45, r: 420, color: "rgba(25, 40, 55, 0.18)" }
  ];

  // Parallax angles dynamically driven by Earth rotation in ALL directions
  let spaceAngleX = 0;
  let spaceAngleY = 0;

  function renderSpace() {
    sCtx.fillStyle = "#030407";
    sCtx.fillRect(0, 0, spaceW, spaceH);

    const centerX = spaceW / 2;
    const centerY = spaceH / 2;

    // Render distant space nebulae with parallax
    nebulae.forEach(n => {
      const nx = centerX + n.x + spaceAngleY * 90;
      const ny = centerY + n.y - spaceAngleX * 90;
      const grad = sCtx.createRadialGradient(nx, ny, 20, nx, ny, n.r);
      grad.addColorStop(0, n.color);
      grad.addColorStop(1, "transparent");
      sCtx.fillStyle = grad;
      sCtx.fillRect(nx - n.r, ny - n.r, n.r * 2, n.r * 2);
    });

    const time = performance.now() * 0.001;
    const cosY = Math.cos(spaceAngleY * 0.35);
    const sinY = Math.sin(spaceAngleY * 0.35);
    const cosX = Math.cos(spaceAngleX * 0.35);
    const sinX = Math.sin(spaceAngleX * 0.35);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];

      // 3D Parallax rotation
      const x1 = s.x * cosY + s.z * sinY;
      const z1 = -s.x * sinY + s.z * cosY;
      const y2 = s.y * cosX - z1 * sinX;

      const px = centerX + x1;
      const py = centerY + y2;

      if (px < -20 || px > spaceW + 20 || py < -20 || py > spaceH + 20) continue;

      const twinkle = Math.sin(time * s.twinkleSpeed * 60 + s.twinklePhase) * 0.25;
      const alpha = Math.max(0.1, Math.min(1, s.baseAlpha + twinkle));

      sCtx.beginPath();
      sCtx.arc(px, py, s.size, 0, Math.PI * 2);
      if (s.hue === 210) {
        sCtx.fillStyle = `rgba(180, 215, 255, ${alpha})`;
      } else if (s.hue === 35) {
        sCtx.fillStyle = `rgba(255, 220, 180, ${alpha})`;
      } else {
        sCtx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      }
      sCtx.fill();
    }
  }

  // ========================================================================
  // 2. Real Earth Globe (True 3D WebGL via Three.js with All-Angle Free Orbit)
  // ========================================================================
  const globeContainer = document.querySelector("#globeContainer");
  const globeWrapper = document.querySelector("#globeTrigger");

  // Three.js Scene Setup
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera.position.z = 2.85;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(200, 200);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  globeContainer.appendChild(renderer.domElement);

  // Sunlight (Illuminating upper-left like screenshot)
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
  sunLight.position.set(-2, 1.5, 2.5);
  scene.add(sunLight);

  // Ambient Light for subtle dark side visibility
  const ambientLight = new THREE.AmbientLight(0x1a2638, 0.55);
  scene.add(ambientLight);

  // Generate Procedural High-Detail Earth Texture (Guaranteed Instant Fallback)
  function createProceduralEarthCanvas() {
    const canvas = document.createElement("canvas");
    canvas.width = 2048;
    canvas.height = 1024;
    const ctx = canvas.getContext("2d");

    // Ocean deep blue
    ctx.fillStyle = "#0c2b48";
    ctx.fillRect(0, 0, 2048, 1024);

    // Shelf waters
    ctx.fillStyle = "#123c68";
    ctx.beginPath();
    ctx.ellipse(1460, 560, 340, 180, 0, 0, Math.PI * 2);
    ctx.ellipse(560, 560, 260, 160, 0, 0, Math.PI * 2);
    ctx.fill();

    function drawPoly(coords, color) {
      ctx.beginPath();
      coords.forEach((pt, idx) => {
        const x = (pt[0] / 360) * 2048;
        const y = ((90 - pt[1]) / 180) * 1024;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    // Eurasia & India
    drawPoly([
      [0, 50], [15, 58], [30, 70], [60, 75], [100, 78], [140, 72], [170, 66], [180, 64],
      [170, 58], [140, 50], [130, 42], [120, 32], [110, 20], [105, 10], [100, 5],
      [95, 15], [90, 22], [82, 8], [77, 8], [72, 22], [68, 25], [60, 25],
      [55, 15], [45, 12], [42, 25], [35, 32], [28, 36], [24, 40], [15, 42], [0, 48]
    ], "#315933");

    // Himalayas / Tibetan Plateau
    drawPoly([[68, 36], [82, 38], [95, 35], [102, 30], [92, 26], [78, 28], [70, 30]], "#7d704d");

    // Middle East & North African Desert
    drawPoly([[35, 32], [45, 35], [55, 30], [60, 25], [55, 15], [45, 12], [42, 25], [32, 28]], "#a68d59");
    drawPoly([
      [-16, 32], [0, 36], [15, 36], [32, 32], [35, 24], [44, 12], [50, 10],
      [42, 2], [32, 4], [25, -5], [10, 4], [-12, 6], [-16, 20]
    ], "#b39962");

    // Sub-Saharan Africa
    drawPoly([
      [-16, 12], [10, 4], [25, -5], [38, 2], [42, -10], [38, -20], [30, -32],
      [20, -34], [16, -30], [12, -15], [8, 4], [-12, 6]
    ], "#2c542b");

    // Australia
    drawPoly([
      [114, -22], [124, -15], [136, -12], [142, -10], [148, -20], [152, -28],
      [148, -38], [138, -36], [130, -32], [116, -34], [114, -26]
    ], "#9c603a");

    // North & South Americas
    drawPoly([
      [-168, 65], [-140, 70], [-100, 72], [-80, 74], [-60, 60], [-65, 45],
      [-75, 35], [-80, 26], [-90, 20], [-100, 20], [-105, 24], [-115, 30],
      [-124, 38], [-126, 48], [-135, 56], [-150, 60], [-168, 65]
    ], "#385b35");

    drawPoly([
      [-76, 8], [-60, 10], [-48, -2], [-35, -6], [-38, -15], [-44, -24],
      [-55, -35], [-66, -54], [-74, -48], [-72, -35], [-70, -20], [-80, -4]
    ], "#244d24");

    // Antarctica & Polar Ice
    ctx.fillStyle = "#e8f2f8";
    ctx.fillRect(0, 960, 2048, 64);
    ctx.fillRect(0, 0, 2048, 42);

    // Cloud Swirls
    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
    for (let c = 0; c < 36; c++) {
      const cx = (c * 68) % 2048;
      const cy = 350 + Math.sin(c * 1.4) * 180;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 140, 28, Math.sin(c) * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    return canvas;
  }

  // Create Base Procedural Texture
  const proceduralCanvas = createProceduralEarthCanvas();
  const earthTexture = new THREE.CanvasTexture(proceduralCanvas);

  // Attempt to upgrade to high-resolution NASA satellite texture map
  const textureLoader = new THREE.TextureLoader();
  textureLoader.crossOrigin = "anonymous";
  textureLoader.load(
    "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_atmos_2048.jpg",
    (tex) => {
      earthMaterial.map = tex;
      earthMaterial.needsUpdate = true;
    },
    undefined,
    () => { /* Keeps high-detail procedural canvas on network restriction */ }
  );

  // Earth Sphere
  const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
  const earthMaterial = new THREE.MeshPhongMaterial({
    map: earthTexture,
    specular: new THREE.Color(0x223344),
    shininess: 12
  });
  const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
  scene.add(earthMesh);

  // Atmosphere Glow Shader (Soft blue luminous rim matching reference image)
  const atmosphereVertexShader = `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;
  const atmosphereFragmentShader = `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.68 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.2);
      gl_FragColor = vec4(0.2, 0.58, 1.0, 1.0) * intensity * 1.5;
    }
  `;
  const atmosphereMaterial = new THREE.ShaderMaterial({
    vertexShader: atmosphereVertexShader,
    fragmentShader: atmosphereFragmentShader,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    transparent: true
  });
  const atmosphereMesh = new THREE.Mesh(new THREE.SphereGeometry(1.16, 64, 64), atmosphereMaterial);
  scene.add(atmosphereMesh);

  // Initial Orientation: Centered on Eurasia / India like uploaded screenshot
  earthMesh.rotation.y = 1.35;
  earthMesh.rotation.x = 0.35;

  // Trackball / Quaternion Orbiting in ALL 360° Angles (Pitch, Yaw, Roll)
  let isDragging = false;
  let prevMouseX = 0;
  let prevMouseY = 0;
  let velocityX = 0;
  let velocityY = 0;

  function onPointerDown(e) {
    isDragging = true;
    prevMouseX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    prevMouseY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
    velocityX = 0;
    velocityY = 0;
  }

  function onPointerMove(e) {
    if (!isDragging) return;
    const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
    const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;

    const deltaX = clientX - prevMouseX;
    const deltaY = clientY - prevMouseY;

    velocityX = deltaX * 0.005;
    velocityY = deltaY * 0.005;

    // Quaternion multiplication enables true spherical rotation in all angles without gimbal lock
    const deltaRotationQuaternion = new THREE.Quaternion()
      .setFromEuler(new THREE.Euler(
        velocityY,
        velocityX,
        0,
        'XYZ'
      ));

    earthMesh.quaternion.multiplyQuaternions(deltaRotationQuaternion, earthMesh.quaternion);

    // Parallax rotate the outer space starfield in sync with user rotation
    spaceAngleY += velocityX * 0.6;
    spaceAngleX -= velocityY * 0.6;

    prevMouseX = clientX;
    prevMouseY = clientY;
  }

  function onPointerUp() {
    isDragging = false;
  }

  globeWrapper.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);

  // Main Render Loop: "rotate ONLY when user rotates"
  function animate() {
    renderSpace();

    // Inertial deceleration: decays to complete standstill
    if (!isDragging) {
      if (Math.abs(velocityX) > 0.00008 || Math.abs(velocityY) > 0.00008) {
        const deltaRotationQuaternion = new THREE.Quaternion()
          .setFromEuler(new THREE.Euler(
            velocityY,
            velocityX,
            0,
            'XYZ'
          ));
        earthMesh.quaternion.multiplyQuaternions(deltaRotationQuaternion, earthMesh.quaternion);

        spaceAngleY += velocityX * 0.6;
        spaceAngleX -= velocityY * 0.6;

        velocityX *= 0.93;
        velocityY *= 0.93;
      } else {
        velocityX = 0;
        velocityY = 0;
      }
    }

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  // ========================================================================
  // 3. Application State & Sidebar Management (Always Restorable)
  // ========================================================================
  const form = document.querySelector("#chatForm");
  const input = document.querySelector("#messageInput");
  const send = document.querySelector("#send");
  const messagesEl = document.querySelector("#messages");
  const welcome = document.querySelector("#welcome");
  const errorEl = document.querySelector("#error");
  const errorMessage = document.querySelector("#errorMessage");
  const apiKeyInput = document.querySelector("#apiKey");
  const apiKeyStatus = document.querySelector("#apiKeyStatus");
  const providerSelect = document.querySelector("#providerSelect");
  const profileSelect = document.querySelector("#profileSelect");
  const profileNameInput = document.querySelector("#profileName");
  const baseUrlInput = document.querySelector("#baseUrl");
  const modelNameInput = document.querySelector("#modelName");
  const openSettingsTop = document.querySelector("#openSettingsTop");
  const sidebarSettingsBtn = document.querySelector("#sidebarSettingsBtn");
  const topbarModelBadge = document.querySelector("#topbarModelBadge");
  const currentModelDisplay = document.querySelector("#currentModelDisplay");
  const modelInfoText = document.querySelector("#modelInfoText");
  const closeSettingsBtn = document.querySelector("#closeSettings");
  const settingsDrawer = document.querySelector("#settingsDrawer");
  const drawerOverlay = document.querySelector("#drawerOverlay");
  const activeThreadTitle = document.querySelector("#activeThreadTitle");
  const appSidebar = document.querySelector("#appSidebar");
  const sidebarToggleBtn = document.querySelector("#sidebarToggleBtn");
  const collapseSidebarBtn = document.querySelector("#collapseSidebarBtn");
  const sidebarOverlay = document.querySelector("#sidebarOverlay");

  // Cohesive Sidebar Toggle Logic: Works for collapse & restore on desktop + mobile
  function toggleSidebar() {
    if (window.innerWidth <= 768) {
      appSidebar.classList.toggle("mobile-open");
      sidebarOverlay.classList.toggle("open");
    } else {
      appSidebar.classList.toggle("collapsed");
    }
  }

  sidebarToggleBtn.addEventListener("click", toggleSidebar);
  collapseSidebarBtn.addEventListener("click", toggleSidebar);
  sidebarOverlay.addEventListener("click", toggleSidebar);

  // Drawer Controls
  function openDrawer() {
    settingsDrawer.classList.add("open");
    drawerOverlay.classList.add("open");
  }

  function closeDrawer() {
    settingsDrawer.classList.remove("open");
    drawerOverlay.classList.remove("open");
  }

  [openSettingsTop, sidebarSettingsBtn, topbarModelBadge].forEach(btn => {
    if (btn) btn.addEventListener("click", openDrawer);
  });
  if (closeSettingsBtn) closeSettingsBtn.addEventListener("click", closeDrawer);
  if (drawerOverlay) drawerOverlay.addEventListener("click", closeDrawer);
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeDrawer();
      if (appSidebar.classList.contains("mobile-open")) toggleSidebar();
    }
  });

  // Profile Management
  const profileStoreKey = "braincellgpt_profiles_v1";
  const supportedProviders = new Set([...providerSelect.options].map(option => option.value));
  const newId = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`).replace(/-/g, "");
  let profiles;
  try { profiles = JSON.parse(sessionStorage.getItem(profileStoreKey) || "[]"); } catch { profiles = []; }
  if (!Array.isArray(profiles)) profiles = [];
  profiles = profiles.filter(p => p && typeof p.id === "string" && typeof p.provider === "string" && supportedProviders.has(p.provider));
  if (!profiles.length) {
    const legacyProvider = sessionStorage.getItem("braincellgpt_provider") || "groq";
    profiles = [{ id: newId(), name: legacyProvider, provider: legacyProvider, model: "", baseUrl: "" }];
  }
  let activeProfileId = sessionStorage.getItem("braincellgpt_active_profile") || profiles[0].id;
  if (!profiles.some(p => p.id === activeProfileId)) activeProfileId = profiles[0].id;
  const activeProfile = () => profiles.find(p => p.id === activeProfileId);

  function persistProfiles() {
    sessionStorage.setItem(profileStoreKey, JSON.stringify(profiles));
    sessionStorage.setItem("braincellgpt_active_profile", activeProfileId);
  }

  function renderProfileOptions() {
    profileSelect.replaceChildren(...profiles.map(profile => {
      const option = document.createElement("option");
      option.value = profile.id;
      option.textContent = profile.name || profile.provider;
      return option;
    }));
    profileSelect.value = activeProfileId;
    document.querySelector("#deleteProfile").disabled = profiles.length <= 1;
  }

  async function refreshKeyStatus() {
    apiKeyInput.value = "";
    apiKeyStatus.dataset.state = "";
    if (["ollama", "lmstudio"].includes(activeProfile().provider)) {
      apiKeyStatus.textContent = activeProfile().provider === "ollama" ? "Ollama local server." : "LM Studio local server.";
      return;
    }
    try {
      const response = await fetch(`/api/profile-secret-status?id=${encodeURIComponent(activeProfileId)}`);
      const data = await response.json();
      apiKeyStatus.textContent = data.configured
        ? "A key is saved in server memory."
        : "No profile key saved. Local .env key will be used if configured.";
    } catch {
      apiKeyStatus.textContent = "Key status unavailable.";
    }
  }

  function updateModelBadge() {
    const providerLabel = providerSelect.options[providerSelect.selectedIndex]?.text.split(" ")[0] || "Groq";
    const customModel = modelNameInput.value.trim();
    const display = customModel ? `${providerLabel} · ${customModel}` : `${providerLabel} · Llama 3.3`;
    currentModelDisplay.textContent = display;
    if (modelInfoText) modelInfoText.textContent = customModel || "Llama 3.3";
  }

  function loadActiveProfile() {
    const profile = activeProfile();
    profileNameInput.value = profile.name || "";
    providerSelect.value = profile.provider;
    modelNameInput.value = profile.model || "";
    baseUrlInput.value = profile.baseUrl || "";
    renderProfileOptions();
    updateModelBadge();
    refreshKeyStatus();
  }

  persistProfiles();
  loadActiveProfile();

  providerSelect.addEventListener("change", () => {
    activeProfile().provider = providerSelect.value;
    activeProfile().name = providerSelect.options[providerSelect.selectedIndex].text.split(" (")[0];
    persistProfiles();
    renderProfileOptions();
    updateModelBadge();
    refreshKeyStatus();
  });

  profileSelect.addEventListener("change", () => {
    activeProfileId = profileSelect.value;
    persistProfiles();
    loadActiveProfile();
  });

  document.querySelector("#addProfile").addEventListener("click", () => {
    const profile = { id: newId(), name: "New profile", provider: providerSelect.value, model: "", baseUrl: "" };
    profiles.push(profile);
    activeProfileId = profile.id;
    persistProfiles();
    loadActiveProfile();
  });

  profileNameInput.addEventListener("input", () => {
    activeProfile().name = profileNameInput.value.trim().slice(0, 64) || "Untitled";
    persistProfiles();
    renderProfileOptions();
  });

  document.querySelector("#deleteProfile").addEventListener("click", async () => {
    if (profiles.length <= 1) return;
    await fetch("/api/profile-secret", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ profile_id: activeProfileId, api_key: "" }) });
    profiles = profiles.filter(profile => profile.id !== activeProfileId);
    activeProfileId = profiles[0].id;
    persistProfiles();
    loadActiveProfile();
  });

  // Chat Execution
  let history = [];
  let busy = false;

  function renderMessage(role, content) {
    welcome.style.display = "none";
    const row = document.createElement("div");
    row.className = `chat-turn ${role}`;

    if (role === "user") {
      row.innerHTML = `<div class="user-message-panel">${escapeHtml(content)}</div>`;
    } else {
      row.innerHTML = `
        <div class="assistant-message-panel">
          <div class="assistant-body"><p>${escapeHtml(content)}</p></div>
          <div class="message-meta-row">
            <button class="btn-action-text copy-btn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              <span>Copy</span>
            </button>
          </div>
        </div>
      `;
      row.querySelector(".copy-btn")?.addEventListener("click", function() {
        navigator.clipboard.writeText(content);
        const s = this.querySelector("span");
        if (s) s.textContent = "Copied";
        setTimeout(() => { if (s) s.textContent = "Copy"; }, 1500);
      });
    }

    messagesEl.appendChild(row);
    row.scrollIntoView({ behavior: "smooth", block: "end" });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function adjustTextareaHeight() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  }

  input.addEventListener("input", adjustTextareaHeight);

  async function sendMessage(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true;
    send.disabled = true;
    input.value = "";
    adjustTextareaHeight();
    errorEl.hidden = true;

    if (history.length === 0) {
      activeThreadTitle.textContent = text.length > 25 ? text.substring(0, 25) + "..." : text;
    }

    renderMessage("user", text);
    const prior = history.slice(-16);
    history.push({ role: "user", content: text });

    const thinkingRow = document.createElement("div");
    thinkingRow.className = "chat-turn assistant";
    thinkingRow.innerHTML = `
      <div class="thinking-notice">
        <span class="thinking-dot"></span>
        <span>BrainCell thinking...</span>
      </div>
    `;
    messagesEl.appendChild(thinkingRow);
    thinkingRow.scrollIntoView({ behavior: "smooth", block: "end" });

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          history: prior,
          provider: providerSelect.value,
          profile_id: activeProfileId,
          base_url: baseUrlInput ? baseUrlInput.value.trim() : "",
          model: modelNameInput ? modelNameInput.value.trim() : ""
        })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed.");
      history.push({ role: "assistant", content: data.reply });
      thinkingRow.remove();
      renderMessage("assistant", data.reply);
    } catch (err) {
      thinkingRow.remove();
      errorEl.hidden = false;
      errorMessage.textContent = err instanceof Error ? err.message : "Something went wrong.";
    } finally {
      busy = false;
      send.disabled = false;
      input.focus();
    }
  }

  // Connection testing
  document.querySelector("#testConnection").addEventListener("click", async () => {
    const btn = document.querySelector("#testConnection");
    btn.disabled = true;
    btn.textContent = "Checking...";
    apiKeyStatus.dataset.state = "checking";
    apiKeyStatus.textContent = "Testing connection...";
    try {
      const response = await fetch("/api/test-connection", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          provider: providerSelect.value,
          profile_id: activeProfileId,
          api_key: apiKeyInput.value.trim(),
          base_url: baseUrlInput ? baseUrlInput.value.trim() : "",
          model: modelNameInput ? modelNameInput.value.trim() : ""
        })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Connection test failed.");
      apiKeyStatus.dataset.state = "success";
      apiKeyStatus.textContent = "Connection verified.";
    } catch (err) {
      apiKeyStatus.dataset.state = "error";
      apiKeyStatus.textContent = err instanceof Error ? err.message : "Connection failed.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Verify";
    }
  });

  // Save / Clear API key
  document.querySelector("#saveApiKey").addEventListener("click", () => {
    const key = apiKeyInput.value.trim();
    if (!key) return;
    fetch("/api/profile-secret", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ profile_id: activeProfileId, api_key: key }) })
      .then(async r => { if (!r.ok) throw new Error(); apiKeyInput.value = ""; apiKeyStatus.dataset.state = "success"; apiKeyStatus.textContent = "Key saved in memory."; })
      .catch(() => { apiKeyStatus.dataset.state = "error"; apiKeyStatus.textContent = "Could not save key."; });
  });

  document.querySelector("#clearApiKey").addEventListener("click", async () => {
    apiKeyInput.value = "";
    await fetch("/api/profile-secret", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ profile_id: activeProfileId, api_key: "" }) });
    apiKeyStatus.dataset.state = "";
    apiKeyStatus.textContent = "Key cleared.";
  });

  [baseUrlInput, modelNameInput].forEach(f => {
    if (f) f.addEventListener("input", () => {
      activeProfile().baseUrl = baseUrlInput.value.trim();
      activeProfile().model = modelNameInput.value.trim();
      persistProfiles();
      updateModelBadge();
    });
  });

  form.addEventListener("submit", e => {
    e.preventDefault();
    sendMessage(input.value);
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  document.querySelector("#newChat").addEventListener("click", () => {
    history = [];
    messagesEl.replaceChildren();
    errorEl.hidden = true;
    welcome.style.display = "flex";
    activeThreadTitle.textContent = "Current Session";
    input.focus();
  });
})();
</script>
</body>
</html>

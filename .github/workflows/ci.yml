name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile app.py
      - name: Check web UI exists
        run: python -c "from pathlib import Path; assert Path('web/index.html').is_file()"
